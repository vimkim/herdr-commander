[project]
name = "herdr-spaces-status"
version = "0.1.0"
description = "First-tab workspace status, orchestration CLI, and commander skill for Herdr"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdr-spaces-status = "herdr_spaces_status.cli:main"
hss = "herdr_spaces_status.cli:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
