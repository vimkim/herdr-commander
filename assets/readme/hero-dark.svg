<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">herdr-commander (hcmd) Architecture Overview</title>
  <desc id="desc">4-tier Herdr hierarchy (Herdr Commander, Space Leaders tabs[0], Tab Leaders tabs[1..8], Pane Workers panes[1..3]) paired with hcmd status/find/peek/wait, socket event waits without sleep polling, and work-tracker correlation.</desc>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#3fb950"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="600" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="598" rx="13" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="50" class="sans" font-size="24" font-weight="700" fill="#f0f6fc">herdr-commander</text>
  <rect x="248" y="29" width="66" height="26" rx="6" fill="#13233a" stroke="#1f6feb" stroke-width="1"/>
  <text x="281" y="47" class="mono" font-size="13" font-weight="700" fill="#58a6ff" text-anchor="middle">hcmd</text>
  <text x="32" y="76" class="sans" font-size="13.5" fill="#8b949e">First-tab-centric status, socket event waits, and 4-tier orchestration for Herdr workspaces</text>

  <!-- Header right badges -->
  <rect x="836" y="32" width="122" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="897" y="49" class="mono" font-size="11.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Python &gt;=3.11</text>

  <rect x="968" y="32" width="106" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="1021" y="49" class="mono" font-size="11.5" font-weight="600" fill="#8b949e" text-anchor="middle">stdlib-only</text>

  <rect x="1084" y="32" width="84" height="26" rx="6" fill="#12261e" stroke="#238636" stroke-width="1"/>
  <text x="1126" y="49" class="mono" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="middle">JSON v1</text>

  <line x1="32" y1="96" x2="1168" y2="96" stroke="#30363d" stroke-width="1"/>

  <!-- Column headers -->
  <text x="32" y="118" class="sans" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8b949e">4-TIER HERDR HIERARCHY</text>
  <text x="720" y="118" class="sans" font-size="11" font-weight="700" letter-spacing="1.2" fill="#8b949e">CONTROL PLANE &amp; TELEMETRY</text>

  <!-- TIER 1: Herdr Commander -->
  <g>
    <rect x="32" y="130" width="648" height="92" rx="10" fill="#161b22" stroke="#1f6feb" stroke-width="1.2"/>
    <rect x="40" y="141" width="4" height="70" rx="2" fill="#58a6ff"/>
    <rect x="54" y="142" width="60" height="21" rx="5" fill="#13233a" stroke="#1f6feb" stroke-width="1"/>
    <text x="84" y="156.5" class="mono" font-size="11" font-weight="700" fill="#58a6ff" text-anchor="middle">TIER 1</text>
    <text x="124" y="157" class="sans" font-size="15.5" font-weight="700" fill="#f0f6fc">Herdr Commander</text>
    <rect x="270" y="142" width="96" height="21" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="318" y="156.5" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" text-anchor="middle">hcmd / hss</text>
    <text x="662" y="156.5" class="mono" font-size="11.5" fill="#8b949e" text-anchor="end">Cross-Workspace</text>

    <text x="54" y="184" class="mono" font-size="12.5" fill="#f0f6fc">status  ·  find  ·  ensure  ·  send  ·  wait  ·  peek</text>
    <text x="54" y="207" class="sans" font-size="12" fill="#8b949e">Resolves tabs[0] &amp; panes[0] in layout order per Space (never assumes t1 or number == 1)</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="356" y1="225" x2="356" y2="238" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- TIER 2: Space Leaders -->
  <g>
    <rect x="32" y="244" width="648" height="108" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.2"/>
    <rect x="40" y="255" width="4" height="86" rx="2" fill="#3fb950"/>
    <rect x="54" y="256" width="60" height="21" rx="5" fill="#12261e" stroke="#238636" stroke-width="1"/>
    <text x="84" y="270.5" class="mono" font-size="11" font-weight="700" fill="#3fb950" text-anchor="middle">TIER 2</text>
    <text x="124" y="271" class="sans" font-size="15.5" font-weight="700" fill="#f0f6fc">Space Leaders</text>
    <rect x="240" y="256" width="144" height="21" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="312" y="270.5" class="mono" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="middle">tabs[0], panes[0]</text>
    <text x="662" y="270.5" class="mono" font-size="11.5" fill="#8b949e" text-anchor="end">Workspace Primary</text>

    <text x="54" y="297" class="mono" font-size="12.5" fill="#f0f6fc">hcmd tab spawn / wait / peek / send / close</text>
    <text x="54" y="319" class="sans" font-size="12" fill="#8b949e">Caps: &lt;= 8 sub-tabs (Alt+Shift+1..9) · &lt;= 4 Space AI agents · &lt;= 10 session working</text>
    <text x="54" y="339" class="mono" font-size="11.5" fill="#6e7681">Tags spawned tabs with HERDR_TAB_ROLE=worker to block recursive tab creation</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="356" y1="355" x2="356" y2="368" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- TIER 3: Tab Leaders -->
  <g>
    <rect x="32" y="374" width="648" height="96" rx="10" fill="#161b22" stroke="#8957e5" stroke-width="1.2"/>
    <rect x="40" y="385" width="4" height="74" rx="2" fill="#bc8cff"/>
    <rect x="54" y="386" width="60" height="21" rx="5" fill="#211932" stroke="#8957e5" stroke-width="1"/>
    <text x="84" y="400.5" class="mono" font-size="11" font-weight="700" fill="#bc8cff" text-anchor="middle">TIER 3</text>
    <text x="124" y="401" class="sans" font-size="15.5" font-weight="700" fill="#f0f6fc">Tab Leaders</text>
    <rect x="222" y="386" width="166" height="21" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="305" y="400.5" class="mono" font-size="11.5" font-weight="600" fill="#bc8cff" text-anchor="middle">tabs[1..8], panes[0]</text>
    <text x="662" y="400.5" class="mono" font-size="11.5" fill="#8b949e" text-anchor="end">build · test · review · ci</text>

    <text x="54" y="428" class="mono" font-size="12.5" fill="#f0f6fc">hcmd pane spawn / wait / peek / send / close</text>
    <text x="54" y="452" class="sans" font-size="12" fill="#8b949e">Caps: &lt;= 3 worker panes (2x2 grid) · never spawns tabs · sets HERDR_PANE_ROLE=worker</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="356" y1="473" x2="356" y2="486" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- TIER 4: Pane Workers -->
  <g>
    <rect x="32" y="492" width="648" height="84" rx="10" fill="#161b22" stroke="#9e6a03" stroke-width="1.2"/>
    <rect x="40" y="503" width="4" height="62" rx="2" fill="#d29922"/>
    <rect x="54" y="504" width="60" height="21" rx="5" fill="#2b2111" stroke="#9e6a03" stroke-width="1"/>
    <text x="84" y="518.5" class="mono" font-size="11" font-weight="700" fill="#d29922" text-anchor="middle">TIER 4</text>
    <text x="124" y="519" class="sans" font-size="15.5" font-weight="700" fill="#f0f6fc">Pane Workers</text>
    <rect x="238" y="504" width="102" height="21" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="289" y="518.5" class="mono" font-size="11.5" font-weight="600" fill="#d29922" text-anchor="middle">panes[1..3]</text>
    <text x="662" y="518.5" class="mono" font-size="11.5" fill="#8b949e" text-anchor="end">Leaf Executors</text>

    <text x="54" y="544" class="mono" font-size="12" fill="#f0f6fc">ai-agent (ay / ai-round)  ·  --launcher shell (bypasses AI agent cap)</text>
    <text x="54" y="564" class="sans" font-size="12" fill="#8b949e">Executes assigned work only · recursive tab and pane spawning blocked</text>
  </g>

  <!-- Horizontal control-plane links -->
  <line x1="686" y1="176" x2="714" y2="176" stroke="#58a6ff" stroke-width="1.5" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="716" y1="312" x2="686" y2="312" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="716" y1="418" x2="686" y2="418" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- RIGHT CARD 1: Inspection & Pre-Launch Safety -->
  <g>
    <rect x="720" y="130" width="448" height="146" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="738" y="155" class="sans" font-size="14.5" font-weight="700" fill="#f0f6fc">Inspection &amp; Pre-Launch Safety</text>
    <rect x="1064" y="138" width="88" height="20" rx="5" fill="#13233a" stroke="#1f6feb" stroke-width="1"/>
    <text x="1108" y="152" class="mono" font-size="10.5" font-weight="700" fill="#58a6ff" text-anchor="middle">PREFLIGHT</text>

    <rect x="738" y="170" width="98" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="787" y="186" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" text-anchor="middle">hcmd status</text>
    <text x="846" y="186" class="sans" font-size="12" fill="#8b949e">tabs[0] + rollup · --verify-busy (busy_bg)</text>

    <rect x="738" y="203" width="98" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="787" y="219" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" text-anchor="middle">hcmd find</text>
    <text x="846" y="219" class="sans" font-size="12" fill="#8b949e">create_new · reuse_empty_shell · warn_busy</text>

    <rect x="738" y="236" width="98" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="787" y="252" class="mono" font-size="11.5" font-weight="600" fill="#58a6ff" text-anchor="middle">hcmd peek</text>
    <text x="846" y="252" class="sans" font-size="12" fill="#8b949e">recent-unwrapped · visible · detection</text>
  </g>

  <!-- RIGHT CARD 2: Socket Event Waits -->
  <g>
    <rect x="720" y="292" width="448" height="152" rx="10" fill="#161b22" stroke="#238636" stroke-width="1.2"/>
    <text x="738" y="317" class="sans" font-size="14.5" font-weight="700" fill="#f0f6fc">Socket Event Waits</text>
    <rect x="1014" y="300" width="138" height="21" rx="5" fill="#12261e" stroke="#238636" stroke-width="1"/>
    <text x="1083" y="314.5" class="mono" font-size="10.5" font-weight="700" fill="#3fb950" text-anchor="middle">NO SLEEP POLLING</text>

    <text x="738" y="340" class="sans" font-size="12" fill="#8b949e">Subscribes to Herdr Unix socket events across tiers:</text>

    <rect x="738" y="352" width="92" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="784" y="368" class="mono" font-size="11.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">hcmd wait</text>

    <rect x="838" y="352" width="118" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="897" y="368" class="mono" font-size="11.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">hcmd tab wait</text>

    <rect x="964" y="352" width="126" height="24" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="1027" y="368" class="mono" font-size="11.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">hcmd pane wait</text>

    <!-- Target states -->
    <rect x="738" y="388" width="66" height="22" rx="5" fill="#2d1619" stroke="#da3633" stroke-width="1"/>
    <text x="771" y="403" class="mono" font-size="11" font-weight="600" fill="#f85149" text-anchor="middle">blocked</text>

    <rect x="811" y="388" width="50" height="22" rx="5" fill="#12261e" stroke="#238636" stroke-width="1"/>
    <text x="836" y="403" class="mono" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">done</text>

    <rect x="868" y="388" width="66" height="22" rx="5" fill="#13233a" stroke="#1f6feb" stroke-width="1"/>
    <text x="901" y="403" class="mono" font-size="11" font-weight="600" fill="#58a6ff" text-anchor="middle">working</text>

    <rect x="941" y="388" width="68" height="22" rx="5" fill="#2b2111" stroke="#9e6a03" stroke-width="1"/>
    <text x="975" y="403" class="mono" font-size="11" font-weight="600" fill="#d29922" text-anchor="middle">busy_bg</text>

    <rect x="1016" y="388" width="46" height="22" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="1039" y="403" class="mono" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">idle</text>

    <rect x="1069" y="388" width="54" height="22" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="1096" y="403" class="mono" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">shell</text>

    <text x="738" y="430" class="mono" font-size="11.5" fill="#6e7681">--until blocked,done · --timeout 300 · --verify-busy</text>
  </g>

  <!-- RIGHT CARD 3: work-tracker Correlation & Contract -->
  <g>
    <rect x="720" y="460" width="448" height="116" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="738" y="484" class="sans" font-size="14.5" font-weight="700" fill="#f0f6fc">work-tracker Correlation &amp; Contract</text>

    <rect x="738" y="495" width="110" height="22" rx="5" fill="#211932" stroke="#8957e5" stroke-width="1"/>
    <text x="793" y="510" class="mono" font-size="11" font-weight="600" fill="#bc8cff" text-anchor="middle">--with-tracker</text>
    <text x="858" y="510" class="sans" font-size="12" fill="#8b949e">Matches open items by cwd &amp; CBRD-NNNNN</text>

    <rect x="738" y="522" width="110" height="22" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="793" y="537" class="mono" font-size="10.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">--json / --plain</text>
    <text x="858" y="537" class="sans" font-size="12" fill="#8b949e">schema_version: 1 envelope · stable TSV</text>

    <rect x="738" y="549" width="110" height="20" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="793" y="563" class="mono" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="middle">Exit codes</text>
    <text x="858" y="563" class="mono" font-size="10.5" fill="#8b949e">0 ok · 1 domain · 2 usage · 75 sock · 78 env</text>
  </g>
</svg>
